name: Release publish

# 手工发版：版本号取自 Plain Craft Launcher 2/metadata.json，工作流只负责构建、
# 按发布线改名（Release / Beta）、算校验值，并同时更新源码仓与 OTA 仓的 Release。
#
# 需要配置的仓库 secret：
#   CLIENT_ID  编译期注入的 Microsoft OAuth client_id（缺省也能构建，只是登录不可用）
#   OTA_TOKEN  可选。用于同步 x1B1C1/PCL_Plus_OTA 的 PAT（contents: write）；
#              没有就只发布当前仓库。

permissions:
  contents: write

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      draft:
        description: '先建草稿，人工确认后再发布'
        required: false
        default: false
        type: boolean
      skip_ota:
        description: '只发源码仓，不碰 OTA 仓'
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

env:
  OTA_REPO: x1B1C1/PCL_Plus_OTA

jobs:
  release:
    name: Publish
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve version from metadata.json
        id: meta
        shell: pwsh
        run: |
          $raw = [IO.File]::ReadAllText('Plain Craft Launcher 2/metadata.json', [Text.Encoding]::UTF8)
          $meta = $raw.TrimStart([char]0xFEFF) | ConvertFrom-Json
          $base = $meta.version.base
          $suffix = $meta.version.suffix
          $ver = if ([string]::IsNullOrWhiteSpace($suffix)) { $base } else { "$base-$suffix" }

          # tag 必须是合法 SemVer：metadata 里写 2.5.2R 这种「给人看」的名字时，
          # 发布 tag 要落成 2.5.2-R，否则会被 OTA 清单的 OrderByPreference 丢弃。
          if ($ver -match '^(\d+\.\d+\.\d+)(R)$') { $ver = "$($Matches[1])-R" }
          if ($ver -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "metadata.json 解析出的版本 '$ver' 不是合法 SemVer"
          }

          # 发布线：空后缀 / R / hotfix 走正式版，其余（Beta1、snapshot-1、nightly-1）走测试版。
          $isRelease = [string]::IsNullOrWhiteSpace($suffix) -or $suffix -match '^(R|release|hotfix)'
          $line = if ($isRelease) { 'Release' } else { 'Beta' }

          Write-Host "版本：$ver（原始 base=$base suffix=$suffix code=$($meta.version.code)）"
          Write-Host "发布线：$line"
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=v$ver" >> $env:GITHUB_OUTPUT
          "line=$line" >> $env:GITHUB_OUTPUT
          "prerelease=$($line -eq 'Beta')" >> $env:GITHUB_OUTPUT

      - name: Validate release tag
        shell: pwsh
        env:
          EXPECTED_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne $env:EXPECTED_TAG) {
            throw "标签 $env:GITHUB_REF_NAME 与 metadata.json 版本不一致，应为 $env:EXPECTED_TAG"
          }
          git show-ref --verify --quiet "refs/tags/$env:EXPECTED_TAG"
          if ($LASTEXITCODE -eq 0) {
            $tagCommit = git rev-parse "$($env:EXPECTED_TAG)^{commit}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "标签 $env:EXPECTED_TAG 已指向其他提交，请更新版本后发布"
            }
          } elseif ($LASTEXITCODE -ne 1) {
            exit $LASTEXITCODE
          }
          exit 0

      - name: Publish single-file exe
        shell: pwsh
        env:
          PCL_WRITE_SECRET: '1'
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
        run: |
          # 生成器只在「环境变量变化」之外还依赖编译期输入，增量编译拿不到新 secret，
          # 所以每次发版都从干净目录开始。
          dotnet publish "Plain Craft Launcher 2/Plain Craft Launcher 2.csproj" `
            -c Release -p:Platform=x64 -r win-x64 --no-self-contained `
            -o dist --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rename assets
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          LINE: ${{ steps.meta.outputs.line }}
        run: |
          $exe = 'dist/Plain Craft Launcher 2.exe'
          if (-not (Test-Path $exe)) { throw "publish 没有产出 $exe" }

          # VERSIONING.md 约定：正式线 Release、测试线 Beta，文件名直接分线。
          $channel = "PCL_Plus_${env:LINE}_x64.exe"
          $pinned = "PCL_Plus_v${env:VERSION}_x64.exe"
          Copy-Item $exe $channel -Force
          Copy-Item $exe $pinned -Force

          foreach ($f in @($channel, $pinned)) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$hash  $f" | Set-Content "$f.sha256" -Encoding ascii
            Write-Host "$f  $((Get-Item $f).Length) B  $hash"
          }

          # 源码包：给不想翻提交历史的人一份可直接解压的树。
          git archive --format=zip -o dist/PCL_Plus-$env:VERSION-src.zip --prefix="PCL_Plus-$env:VERSION/" HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare release notes
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $notes = "release-assets/notes-$env:VERSION.md"
          if (-not (Test-Path $notes)) {
            Write-Host "没有找到 $notes，退回 CHANGELOG.md" -ForegroundColor Yellow
            $notes = 'docs/CHANGELOG.md'
          }
          if (-not (Test-Path $notes)) { throw "既没有 notes 也没有 CHANGELOG.md" }
          Copy-Item $notes 'dist/notes.md' -Force
          Write-Host "使用发布说明：$notes"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PCL_Plus-${{ steps.meta.outputs.tag }}-x64
          path: |
            PCL_Plus_*.exe
            PCL_Plus_*.exe.sha256
            dist/*.zip
            dist/notes.md
          if-no-files-found: error
          retention-days: 30

      - name: Create Release on source repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          LINE: ${{ steps.meta.outputs.line }}
          DRAFT: ${{ inputs.draft }}
        run: |
          $ghArgs = @('release', 'create', $env:TAG, '--repo', $env:GITHUB_REPOSITORY,
                    '--target', $env:GITHUB_SHA, '--title', "PCL_Plus $env:VERSION", '--notes-file', 'dist/notes.md')
          if ($env:LINE -eq 'Beta') { $ghArgs += '--prerelease' }
          if ($env:DRAFT -eq 'true') { $ghArgs += '--draft' }

          $assets = @(
            "PCL_Plus_$($env:LINE)_x64.exe",
            "PCL_Plus_$($env:LINE)_x64.exe.sha256",
            "PCL_Plus_v$($env:VERSION)_x64.exe",
            "PCL_Plus_v$($env:VERSION)_x64.exe.sha256",
            "dist/PCL_Plus-$($env:VERSION)-src.zip"
          ) | Where-Object { Test-Path $_ }
          $ghArgs += $assets

          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Mirror Release to OTA repository
        if: ${{ !inputs.skip_ota }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.OTA_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          LINE: ${{ steps.meta.outputs.line }}
          DRAFT: ${{ inputs.draft }}
          OTA_REPO: x1B1C1/PCL_Plus_OTA
        run: |
          # secrets 不能出现在 if: 里，只能在脚本内部判断是否配置了 token。
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            Write-Host '未配置 OTA_TOKEN，跳过 OTA 仓同步。'
            exit 0
          }

          # OTA 仓只放发布资产与校验值，源码包留在源码仓。
          $ghArgs = @('release', 'create', $env:TAG, '--repo', $env:OTA_REPO,
                    '--title', "PCL_Plus $env:VERSION", '--notes-file', 'dist/notes.md')
          if ($env:LINE -eq 'Beta') { $ghArgs += '--prerelease' }
          if ($env:DRAFT -eq 'true') { $ghArgs += '--draft' }

          $ghArgs += @(
            "PCL_Plus_$($env:LINE)_x64.exe",
            "PCL_Plus_$($env:LINE)_x64.exe.sha256",
            "PCL_Plus_v$($env:VERSION)_x64.exe",
            "PCL_Plus_v$($env:VERSION)_x64.exe.sha256"
          )
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Summary
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          LINE: ${{ steps.meta.outputs.line }}
        run: |
          Write-Host "已发布 $env:TAG（$env:LINE 线）" -ForegroundColor Green
          Write-Host "资产：PCL_Plus_${env:LINE}_x64.exe、PCL_Plus_v$($env:VERSION)_x64.exe 及校验值"
